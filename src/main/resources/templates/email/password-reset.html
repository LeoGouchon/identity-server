<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{email/fragments/layout :: layout(~{::title}, ~{::content})}">
<head><title>Réinitialisation de votre mot de passe</title></head>
<body>
<div th:fragment="content">
    <h1 style="font-size: 24px;">Réinitialisation de votre mot de passe</h1>
    <p>Pour choisir un nouveau mot de passe, cliquez sur le bouton ci-dessous :</p>
    <p><a th:href="${resetUrl}" style="display: inline-block; padding: 12px 20px; background-color: #18181b; color: #ffffff; text-decoration: none; border-radius: 6px;">Réinitialiser mon mot de passe</a></p>
    <p>Ce lien expire dans 30 minutes.</p>
</div>
</body>
</html>
