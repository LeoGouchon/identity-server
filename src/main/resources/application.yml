spring:
  application:
    name: identity-server
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:Identity Server <no-reply@example.com>}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:true}
      mail.smtp.ssl.enable: ${SMTP_SSL_ENABLE:false}
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${IDENTITY_COOKIE_SECURE:false}
        same-site: ${IDENTITY_COOKIE_SAME_SITE:LAX}

cookie:
  secure: false

identity:
  password-reset:
    token-ttl-minutes: ${IDENTITY_PASSWORD_RESET_TTL_MINUTES:30}
