spring.application.name=identity-server
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${IDENTITY_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${IDENTITY_COOKIE_SAME_SITE:LAX}

# HikariCP Connection Pool Tuning
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=0

# CORS
identity.cors.allowed-origins=${IDENTITY_CORS_ALLOWED_ORIGINS:}
cookie.secure=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
identity.issuer=${IDENTITY_ISSUER:http://localhost:8081}
identity.oauth-clients=${IDENTITY_OAUTH_CLIENTS:default-web=http://localhost:4200/auth/callback|https://app.example.com/auth/callback}
identity.allowed-backends=${IDENTITY_ALLOWED_BACKENDS:default-api}
identity.scopes=${IDENTITY_SCOPES:openid profile email}
identity.access-token-ttl-seconds=${IDENTITY_ACCESS_TOKEN_TTL_SECONDS:600}
identity.refresh-token-ttl-days=${IDENTITY_REFRESH_TOKEN_TTL_DAYS:30}
identity.provisioning-url=${IDENTITY_PROVISIONING_URL:http://localhost:8080/api/internal/identity-users}
identity.provisioning-secret=${IDENTITY_PROVISIONING_SECRET:change-me}
