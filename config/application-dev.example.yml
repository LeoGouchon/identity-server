spring:
  application:
    name: identity-server
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:Identity Server <no-reply@example.com>}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:true}
      mail.smtp.ssl.enable: ${SMTP_SSL_ENABLE:false}
  datasource:
    url: jdbc:postgresql://db:5432/${DB_NAME:identity}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD:identity-local}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev-data
    schemas: public

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        same-site: LAX

cookie:
  secure: false

identity:
  auth-frontend-url: http://localhost:5180
  issuer: http://localhost:8081
  oauth-clients:
    - client-id: auth-portal
      redirect-uris:
        - http://localhost:5180/auth/callback
        - http://localhost:5180/auth/logout-callback

    - client-id: web-client
      redirect-uris:
        - http://localhost:4200/auth/callback

    - client-id: kicker-client
      redirect-uris:
        - http://localhost:5173/auth/callback
        - http://localhost:5173/auth/logout-callback

  allowed-backends:
    - default-api
  scopes:
    - openid
    - profile
    - email
  access-token-ttl-seconds: 600
  refresh-token-ttl-days: 30
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:5173
      - http://localhost:5180
  provisioning-url: http://localhost:8080/api/internal/identity-users
  provisioning-secret: change-me
  password-reset:
    token-ttl-minutes: 30
