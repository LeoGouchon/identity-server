services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-identity}
      POSTGRES_USER: ${DB_USER:-identity}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-identity-local}
    ports:
      - "5434:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - db

  tests:
    image: maven:3.9.6-eclipse-temurin-21
    working_dir: /app
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    command: mvn test

volumes:
  dbdata:
  maven-cache:
