services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      IDENTITY_ISSUER: http://localhost:8081
      IDENTITY_CORS_ALLOWED_ORIGINS: ${IDENTITY_CORS_ALLOWED_ORIGINS:}
      IDENTITY_OAUTH_CLIENTS: ${IDENTITY_OAUTH_CLIENTS:default-web=http://localhost:4200/auth/callback|https://app.example.com/auth/callback}
      IDENTITY_ALLOWED_BACKENDS: ${IDENTITY_ALLOWED_BACKENDS:default-api}
      IDENTITY_PROVISIONING_URL: ${IDENTITY_PROVISIONING_URL:http://localhost:8080/api/internal/identity-users}
      IDENTITY_PROVISIONING_SECRET: ${IDENTITY_PROVISIONING_SECRET:change-me}
    depends_on:
      - db

  tests:
    image: maven:3.9.6-eclipse-temurin-21
    working_dir: /app
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    command: mvn test

volumes:
  dbdata:
  maven-cache:
